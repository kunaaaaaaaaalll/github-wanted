<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- GitHub Wanted favicon: the GW badge (cyan hexagon, gold star, "GW") simplified for 16–32px.
       Colors are the design tokens: night #0b0614, cyan #2de2e6, gold #ffd36e, white #f5f5f5.
       "GW" is drawn as paths: favicons can't load web fonts, so Anton would never render here. -->
  <!-- Night tile: keeps contrast on light and dark browser tabs alike. -->
  <rect width="32" height="32" rx="7" fill="#0b0614"/>
  <!-- Flat-top hexagon, coordinates on the half-pixel so the 2px stroke lands on whole pixels. -->
  <polygon points="9.5,5 22.5,5 28.5,16 22.5,27 9.5,27 3.5,16" fill="none" stroke="#2de2e6" stroke-width="2" stroke-linejoin="round"/>
  <!-- Night notch behind the star, cutting the hexagon's top edge so the star reads on its own. -->
  <circle cx="16" cy="5" r="3.6" fill="#0b0614"/>
  <polygon points="16,1.6 16.9,3.8 19.2,4 17.4,5.5 18,7.8 16,6.6 14,7.8 14.6,5.5 12.8,4 15.1,3.8" fill="#ffd36e"/>
  <!-- "GW" in blocky condensed strokes, echoing Anton. -->
  <g fill="none" stroke="#f5f5f5" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M14.4 12.2H10.1V20.8H14.4V16.9H12.4"/>
    <path d="M16.6 12.2L17.9 20.8L19.6 15.6L21.3 20.8L22.6 12.2"/>
  </g>
</svg>
