<!-- 1. CSS/SVG fallback city: visible immediately, and permanently when WebGL is unavailable. -->
<div class="fallback">
  <div class="sky"></div>
  <!-- Sun: a gold→pink disc with horizontal cut lines, masked in SVG so the sky shows through the cuts. -->
  <svg class="sun" viewBox="0 0 100 100" focusable="false">
    <defs>
      <linearGradient id="gw-sun-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="sun-top" />
        <stop offset="1" class="sun-bottom" />
      </linearGradient>
      <mask id="gw-sun-cuts">
        <rect width="100" height="100" fill="white" />
        <!-- Cut lines thicken toward the bottom, like the 3D shader. -->
        <rect y="56" width="100" height="1.2" fill="black" />
        <rect y="63" width="100" height="2" fill="black" />
        <rect y="70" width="100" height="3" fill="black" />
        <rect y="77.5" width="100" height="4" fill="black" />
        <rect y="85" width="100" height="5" fill="black" />
        <rect y="92.5" width="100" height="6" fill="black" />
      </mask>
    </defs>
    <circle cx="50" cy="50" r="50" fill="url(#gw-sun-fill)" mask="url(#gw-sun-cuts)" />
  </svg>
  <svg class="skyline" viewBox="0 0 1000 200" preserveAspectRatio="none" focusable="false">
    <path [attr.d]="skyline" />
  </svg>
  <div class="ground"></div>
</div>

<!-- 2. The live city. Starts invisible; fades in after its first frame. -->
<canvas #stage class="stage"></canvas>
